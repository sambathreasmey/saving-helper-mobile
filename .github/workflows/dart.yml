name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get

      # Install missing Xcode components (if applicable)
      - run: sudo xcode-select --switch /Applications/Xcode.app
      - run: sudo xcodebuild -runFirstLaunch  # In case the Xcode is not set up yet

      - run: pod repo update
        working-directory: ios

      # Build for real device in Release mode with specified iOS version
      - run: flutter build ios --release --no-codesign --ios-deployment-target=16.0

      # If needed, build for simulator with a compatible iOS version (e.g., 16.0)
      # Uncomment if you need a simulator build
      # - run: flutter build ios --debug --no-codesign --simulator --ios-deployment-target=16.0

      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          tag: v2.0.3+8
          overwrite: true
          body: "What's new: glass theme and total repay option."
