name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - run: flutter pub get

      # Install missing Xcode components (if applicable)
      - run: sudo xcode-select --switch /Applications/Xcode.app
      - run: sudo xcodebuild -runFirstLaunch  # In case the Xcode is not set up yet

      - run: pod repo update
        working-directory: ios

      # Set iOS platform version to 16.0 or 17.0 in Podfile
      - run: |
          sed -i '' 's/platform :ios, .*/platform :ios, "16.0"/' ios/Podfile
          flutter pub get

      # Build for simulator (try to use a supported simulator version like iOS 16.0)
      - run: flutter build ios --debug --no-codesign --simulator --ios-deployment-target=16.0

      - run: mkdir Payload
        working-directory: build/ios/iphonesimulator

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphonesimulator

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphonesimulator

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphonesimulator/FlutterIpaExport.ipa
          tag: v2.0.4+1
          overwrite: true
          body: "What's new: glass theme and total repay option2."

